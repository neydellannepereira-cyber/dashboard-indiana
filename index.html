<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --indiana-blue: #0052CC;
            --indiana-blue-light: #4C9AFF;
            --indiana-blue-pale: #DEEBFF;
            --indiana-purple: #5B2D82;
            --indiana-purple-light: #8777D9;
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --success: #10B981;
            --warning: #F59E0B;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            background: linear-gradient(135deg, var(--indiana-blue) 0%, var(--indiana-purple) 100%);
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo-dot {
            color: #FFD700;
        }

        .header-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            font-weight: 400;
        }

        .header-info {
            text-align: right;
            color: #fff;
        }

        .header-info .date {
            font-size: 13px;
            opacity: 0.8;
        }

        .header-info .update {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .stat-icon.blue { background: var(--indiana-blue-pale); }
        .stat-icon.purple { background: #EDE9FE; }
        .stat-icon.green { background: #D1FAE5; }
        .stat-icon.orange { background: #FEF3C7; }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .controls {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--indiana-blue);
            background: #fff;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: var(--bg-primary);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .filter-btn:hover {
            border-color: var(--indiana-blue-light);
            color: var(--indiana-blue);
        }

        .filter-btn.active {
            background: var(--indiana-blue);
            border-color: var(--indiana-blue);
            color: #fff;
        }

        .export-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--indiana-blue) 0%, var(--indiana-purple) 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .regionais-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 24px;
        }

        .regional-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }

        .regional-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .regional-header {
            background: linear-gradient(135deg, var(--indiana-blue) 0%, var(--indiana-blue-light) 100%);
            padding: 20px 24px;
        }

        .regional-header.has-distrital {
            background: linear-gradient(135deg, var(--indiana-purple) 0%, var(--indiana-purple-light) 100%);
        }

        .regional-info {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 12px;
        }

        .regional-badge {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .regional-details {
            flex: 1;
        }

        .regional-details h3 {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .regional-details .gerente {
            color: rgba(255,255,255,0.95);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .contato-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contato-item {
            color: rgba(255,255,255,0.85);
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .contato-icon {
            width: 14px;
            text-align: center;
        }

        .regional-count {
            background: rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            display: inline-block;
        }

        .regional-body {
            padding: 20px 24px;
        }

        .distrital-section {
            margin-bottom: 20px;
        }

        .distrital-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--indiana-purple-light);
        }

        .distrital-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--indiana-purple) 0%, var(--indiana-purple-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            flex-shrink: 0;
        }

        .distrital-info {
            flex: 1;
        }

        .distrital-name {
            font-weight: 600;
            color: var(--indiana-purple);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .distrital-contato {
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .distrital-count {
            background: #EDE9FE;
            color: var(--indiana-purple);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .filiais-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filial-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-primary);
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .filial-item:hover {
            background: var(--indiana-blue-pale);
            border-color: var(--indiana-blue-light);
        }

        .filial-item.distrital-filial {
            background: #F5F3FF;
        }

        .filial-item.distrital-filial:hover {
            background: #EDE9FE;
            border-color: var(--indiana-purple-light);
        }

        .filial-codigo {
            font-weight: 700;
            color: var(--indiana-blue);
            font-size: 12px;
            min-width: 32px;
        }

        .filial-item.distrital-filial .filial-codigo {
            color: var(--indiana-purple);
        }

        .filial-nome {
            color: var(--text-primary);
            font-weight: 500;
        }

        .section-divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        .diretas-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .diretas-label::before {
            content: '';
            width: 16px;
            height: 2px;
            background: var(--indiana-blue);
            border-radius: 1px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .footer {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .regionais-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
            .header-info {
                text-align: center;
            }
            .controls {
                flex-direction: column;
            }
            .search-box {
                width: 100%;
            }
        }

        @media print {
            .controls, .export-btn { display: none; }
            .regional-card { break-inside: avoid; }
        }
    </style>
</head>

        let currentFilter = 'all';

        document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });

        function updateStats() {
            const totalRegionais = dadosRegionais.length;
            const totalDistritais = dadosRegionais.reduce((acc, r) => acc + r.distritais.length, 0);
            const totalFiliais = dadosRegionais.reduce((acc, r) => acc + r.total_filiais, 0);
            const totalGerentes = totalRegionais + totalDistritais;

            document.getElementById('totalRegionais').textContent = totalRegionais;
            document.getElementById('totalDistritais').textContent = totalDistritais;
            document.getElementById('totalFiliais').textContent = totalFiliais;
            document.getElementById('totalGerentes').textContent = totalGerentes;
        }

        function renderRegionais(data, searchTerm = '') {
            const container = document.getElementById('regionaisContainer');
            const search = searchTerm.toLowerCase().trim();

            let filtered = data;

            if (currentFilter === 'with-distrital') {
                filtered = data.filter(r => r.distritais.length > 0);
            } else if (currentFilter === 'without-distrital') {
                filtered = data.filter(r => r.distritais.length === 0);
            }

            if (search) {
                filtered = filtered.filter(r => {
                    const matchRegional = r.codigo.toLowerCase().includes(search) || 
                                         r.gerente.toLowerCase().includes(search) ||
                                         (r.telefone && r.telefone.includes(search)) ||
                                         (r.email && r.email.toLowerCase().includes(search));
                    const matchDistrital = r.distritais.some(d => 
                        d.nome.toLowerCase().includes(search) ||
                        (d.telefone && d.telefone.includes(search)) ||
                        (d.email && d.email.toLowerCase().includes(search)) ||
                        d.filiais.some(f => f.nome.toLowerCase().includes(search) || 
                                          f.codigo.toString().includes(search))
                    );
                    const matchFilial = r.filiais_diretas.some(f => 
                        f.nome.toLowerCase().includes(search) || 
                        f.codigo.toString().includes(search)
                    );
                    return matchRegional || matchDistrital || matchFilial;
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">🔍</div>
                        <p>Nenhuma regional encontrada</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(regional => `
                <div class="regional-card">
                    <div class="regional-header ${regional.distritais.length > 0 ? 'has-distrital' : ''}">
                        <div class="regional-info">
                            <div class="regional-badge">${regional.codigo}</div>
                            <div class="regional-details">
                                <h3>Regional ${regional.codigo}</h3>
                                <div class="gerente">👤 ${regional.gerente}</div>
                                <div class="contato-info">
                                    ${regional.telefone ? `<div class="contato-item"><span class="contato-icon">📞</span>${regional.telefone}</div>` : ''}
                                    ${regional.email ? `<div class="contato-item"><span class="contato-icon">✉️</span>${regional.email}</div>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="regional-count">${regional.total_filiais} filiais</div>
                    </div>
                    <div class="regional-body">
                        ${regional.distritais.map(distrital => `
                            <div class="distrital-section">
                                <div class="distrital-header">
                                    <div class="distrital-icon">👤</div>
                                    <div class="distrital-info">
                                        <div class="distrital-name">${distrital.nome}</div>
                                        <div class="distrital-contato">
                                            ${distrital.telefone ? `<span>📞 ${distrital.telefone}</span>` : ''}
                                            ${distrital.email ? `<span>✉️ ${distrital.email}</span>` : ''}
                                        </div>
                                    </div>
                                    <span class="distrital-count">${distrital.filiais.length} filiais</span>
                                </div>
                                <div class="filiais-list">
                                    ${distrital.filiais.map(f => `
                                        <div class="filial-item distrital-filial">
                                            <span class="filial-codigo">#${f.codigo}</span>
                                            <span class="filial-nome">${f.nome}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                        ${regional.distritais.length > 0 && regional.filiais_diretas.length > 0 ? '<div class="section-divider"></div>' : ''}
                        ${regional.filiais_diretas.length > 0 ? `
                            <div class="diretas-label">Diretas ao Regional (${regional.filiais_diretas.length})</div>
                            <div class="filiais-list">
                                ${regional.filiais_diretas.map(f => `
                                    <div class="filial-item">
                                        <span class="filial-codigo">#${f.codigo}</span>
                                        <span class="filial-nome">${f.nome}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function exportToExcel() {
            let csv = 'Regional;Gerente Regional;Telefone Regional;Email Regional;Gerente Distrital;Telefone Distrital;Email Distrital;Código Filial;Nome Filial;Tipo\n';
            
            dadosRegionais.forEach(regional => {
                regional.distritais.forEach(distrital => {
                    distrital.filiais.forEach(filial => {
                        csv += `${regional.codigo};${regional.gerente};${regional.telefone || ''};${regional.email || ''};${distrital.nome};${distrital.telefone || ''};${distrital.email || ''};${filial.codigo};${filial.nome};Com Distrital\n`;
                    });
                });
                regional.filiais_diretas.forEach(filial => {
                    csv += `${regional.codigo};${regional.gerente};${regional.telefone || ''};${regional.email || ''};;;;${filial.codigo};${filial.nome};Direta ao Regional\n`;
                });
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Estrutura_Regional_Indiana_Completa_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderRegionais(dadosRegionais, e.target.value);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderRegionais(dadosRegionais, document.getElementById('searchInput').value);
            });
        });

        updateStats();
        renderRegionais(dadosRegionais);
    </script>
